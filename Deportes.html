   <!-- DEPORTES -->
        <div x-show="page === 'deportes'" x-cloak x-transition.opacity.duration.500ms class="space-y-10">

            <div class="grid grid-cols-1 md:grid-cols-3 gap-8 items-start">

                        <div class="w-full h-32 relative flex items-center justify-center overflow-hidden bg-gradient-to-br"

                            <div class="absolute top-4 left-4 bg-bloom-button text-bloom-text w-10 h-10 rounded-full flex items-center justify-center shadow-md">
                                <span class="material-symbols-outlined font-bold text-xl" x-text="sport.icon"></span>
                            </div>

                            <span class="absolute top-4 right-4 bg-black/60 text-white font-sport text-[10px] px-2 py-1 uppercase tracking-wider italic rounded" x-text="sport.schedule"></span>
                        </div>

                        <div class="p-6 flex-1 flex flex-col justify-between">
                            <div>
                                <div class="flex justify-between items-center mb-3">
                                    <h3 class="font-sport font-bold tracking-wide uppercase text-2xl italic" :class="darkMode ? 'text-white' : 'text-bloom-text'" x-text="sport.name"></h3>
                                    <span class="text-[11px] font-bold uppercase tracking-wider px-2 py-0.5 rounded"
                                          :class="sport.slots > 0 ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'"
                                          x-text="sport.slots > 0 ? sport.slots + ' cupos' : 'Lleno'"></span>
                                </div>
                                <p class="font-normal text-xs leading-relaxed mb-4" :class="darkMode ? 'text-gray-300' : 'text-bloom-text/80'" x-text="sport.desc"></p>
                               
                                <div class="space-y-1 text-[11px] font-medium uppercase tracking-wider font-sport border-t pt-3"
                                     :class="darkMode ? 'text-gray-400 border-white/5' : 'text-bloom-text/60 border-bloom-text/5'">
                                    <div><strong>Entrenador:</strong> <span :class="darkMode ? 'text-white' : 'text-bloom-text'" x-text="sport.coach"></span></div>
                                    <div><strong>Lugar:</strong> <span :class="darkMode ? 'text-white' : 'text-bloom-text'" x-text="sport.location"></span></div>
                                </div>
                            </div>

                            <div class="pt-6 space-y-2">
                                <button @click="viewSportDetails(sport)"
                                        class="w-full py-2 border border-bloom-text/20 font-sport text-xs font-bold uppercase tracking-widest rounded-lg flex items-center justify-center gap-2 transition-all hover:bg-bloom-button hover:text-bloom-text hover:border-transparent cursor-pointer"
                                        :class="darkMode ? 'border-white/20 text-white' : 'text-bloom-text bg-white'">
                                    <span class="material-symbols-outlined text-sm">menu_book</span>
                                    <span>Ver Manual e Historia</span>
                                </button>

                                <button @click="toggleEnrollment(sport)"
                                        :disabled="sport.slots <= 0 && !sport.enrolled"
                                        class="w-full py-2.5 font-sport font-bold italic uppercase tracking-wider text-xs rounded-lg transition-all duration-300 shadow cursor-pointer"
                                        :class="sport.enrolled
                                                ? 'bg-periwinkle-500 text-white hover:bg-periwinkle-600'
                                                : (sport.slots > 0 ? 'bg-bloom-button hover:bg-bloom-buttonHover text-bloom-text' : 'bg-gray-300 text-gray-500 cursor-not-allowed')">
                                    <span x-text="sport.enrolled ? 'Inscrito ✓ (Cancelar)' : (sport.slots > 0 ? 'Inscribirme ahora' : 'Sin Cupos Disponibles')"></span>
                                </button>
                            </div>
                        </div>

                    </div>
                </template>
            </div>
        </div>

        <!-- DETALLE DEPORTE -->
        <div x-show="page === 'deporte-detalle'" x-cloak x-transition.opacity.duration.500ms class="max-w-4xl mx-auto space-y-8">

                <span class="material-symbols-outlined">arrow_back</span> Volver a Deportes
            </button>

                <div class="border border-bloom-text/10 rounded-2xl overflow-hidden shadow-xl" :class="darkMode ? 'bg-[#242424] border-white/10' : 'bg-white'">
                    <div class="w-full h-40 relative flex items-end p-8 bg-gradient-to-br" :class="selectedSport.bgStyle">
                        <div class="absolute inset-0 bg-black/30"></div>
                        <div class="relative z-10 flex items-center gap-4 text-white">
                            <div class="bg-bloom-button text-bloom-text w-14 h-14 rounded-full flex items-center justify-center shadow-lg">
                                <span class="material-symbols-outlined font-bold text-3xl" x-text="selectedSport.icon"></span>
                            </div>
                            <div>
                                <h1 class="font-sport text-4xl md:text-5xl font-bold uppercase italic tracking-wide" x-text="selectedSport.name"></h1>
                                <p class="text-xs uppercase tracking-widest text-bloom-button" x-text="'Cátedra Técnica e Histórica • Directo desde ' + selectedSport.details.origin"></p>
                            </div>
                        </div>
                    </div>

                    <div class="p-8 md:p-12 space-y-10">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                            <div class="space-y-2">
                                <h3 class="font-sport text-lg font-bold uppercase tracking-widest text-bloom-buttonHover flex items-center gap-2">
                                    <span class="material-symbols-outlined text-xl">info</span> ¿Qué es?
                                </h3>
                                <p class="text-sm font-normal leading-relaxed" :class="darkMode ? 'text-gray-300' : 'text-bloom-text/90'" x-text="selectedSport.details.definition"></p>
                            </div>
                            <div class="space-y-2">
                                <h3 class="font-sport text-lg font-bold uppercase tracking-widest text-bloom-buttonHover flex items-center gap-2">
                                    <span class="material-symbols-outlined text-xl">sports</span> ¿Cómo se juega?
                                </h3>
                                <p class="text-sm font-normal leading-relaxed" :class="darkMode ? 'text-gray-300' : 'text-bloom-text/90'" x-text="selectedSport.details.howToPlay"></p>
                            </div>
                        </div>

                        <div class="p-6 bg-bloom-light/40 border border-bloom-text/5 rounded-xl space-y-3" :class="darkMode ? 'bg-black/20 border-white/5' : ''">
                            <h3 class="font-sport text-base font-bold uppercase tracking-widest text-bloom-buttonHover flex items-center gap-2">
                                <span class="material-symbols-outlined text-xl">gavel</span> Reglamento Oficial / Reglas Clave

                                    <li class="flex items-start gap-2">
                                        <span class="font-sport font-bold text-bloom-buttonHover mt-0.5" x-text="(index + 1) + '.'"></span>
                                        <span x-text="rule"></span>
                                    </li>
                                </template>
                            </ul>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 pt-4 border-t" :class="darkMode ? 'border-white/5' : 'border-bloom-text/5'">
                            <div class="space-y-1">
                                <h4 class="font-sport text-xs font-bold uppercase tracking-wider text-bloom-buttonHover flex items-center gap-1">
                                    <span class="material-symbols-outlined text-sm">location_on</span> Cuna / Lugar de Origen
                                </h4>
                                <p class="text-sm font-bold" :class="darkMode ? 'text-white' : 'text-bloom-text'" x-text="selectedSport.details.origin"></p>
                            </div>
                            <div class="md:col-span-2 space-y-1">
                                <h4 class="font-sport text-xs font-bold uppercase tracking-wider text-bloom-buttonHover flex items-center gap-1">
                                    <span class="material-symbols-outlined text-sm">history_edu</span> Reseña Histórica
                                </h4>
                                <p class="text-xs font-normal leading-relaxed" :class="darkMode ? 'text-gray-400' : 'text-bloom-text/70'" x-text="selectedSport.details.history"></p>

                        </div>

                    </div>
                </div>
            </template>
