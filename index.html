<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal CEB - Social Comunicativo</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FullCalendar CDN -->
    <link href='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css' rel='stylesheet' />
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js'></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col font-sans">

    <!-- CONTENEDOR DE AUTENTICACIÓN (LOGIN / REGISTRO) -->
    <div id="auth-container" class="flex items-center justify-center h-screen w-full absolute inset-0 bg-gray-100 z-50">
        <!-- Vista Login -->
        <div id="login-box" class="bg-white p-8 rounded-lg shadow-lg w-96">
            <h2 class="text-2xl font-bold mb-6 text-center text-gray-800">Iniciar Sesión</h2>
            <form onsubmit="handleLogin(event)">
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2">Correo Electrónico</label>
                    <input type="email" id="login-email" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="mb-6">
                    <label class="block text-gray-700 text-sm font-bold mb-2">Contraseña</label>
                    <input type="password" id="login-pass" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-blue-700 transition">Entrar</button>
            </form>
            <p class="mt-4 text-center text-sm text-gray-600">¿No tienes cuenta? <button onclick="toggleAuth(true)" class="text-blue-500 hover:underline font-semibold">Regístrate</button></p>
        </div>

        <!-- Vista Registro -->
        <div id="register-box" class="bg-white p-8 rounded-lg shadow-lg w-96 hidden">
            <h2 class="text-2xl font-bold mb-6 text-center text-gray-800">Registro de Usuario</h2>
            <form onsubmit="handleRegister(event)">
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2">Nombre</label>
                    <input type="text" id="reg-name" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 text-sm font-bold mb-2">Correo Electrónico</label>
                    <input type="email" id="reg-email" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
                </div>
                <div class="mb-6">
                    <label class="block text-gray-700 text-sm font-bold mb-2">Contraseña</label>
                    <input type="password" id="reg-pass" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
                </div>
                <button type="submit" class="w-full bg-green-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-green-700 transition">Registrarse</button>
            </form>
            <p class="mt-4 text-center text-sm text-gray-600">¿Ya tienes cuenta? <button onclick="toggleAuth(false)" class="text-blue-500 hover:underline font-semibold">Inicia sesión</button></p>
        </div>
    </div>

    <!-- APLICACIÓN PRINCIPAL (OCULTA HASTA INICIAR SESIÓN) -->
    <div id="app-container" class="hidden flex-col min-h-screen">
        <!-- Navbar -->
        <nav class="bg-white shadow p-4 flex justify-between items-center">
            <h1 class="text-xl font-bold text-gray-800">Portal CEB <span class="text-xs bg-blue-100 text-blue-800 px-2 py-1 rounded ml-2">Socio Comunicativo</span></h1>
            <div class="space-x-4 flex items-center">
                <button onclick="switchTab('tablero')" id="nav-tablero" class="text-blue-600 font-semibold hover:underline">Tablero</button>
                <button onclick="switchTab('calendario')" id="nav-calendario" class="text-gray-600 hover:underline">Calendario</button>
                <span id="user-display" class="text-sm bg-gray-200 px-3 py-1 rounded-full text-gray-700 font-medium"></span>
                <button onclick="logout()" class="text-red-500 font-semibold hover:underline">Cerrar Sesión</button>
            </div>
        </nav>

        <!-- SECCIÓN: TABLERO DE ANUNCIOS -->
        <section id="section-tablero" class="container mx-auto p-6 max-w-4xl flex-grow">
            <h2 class="text-2xl font-bold mb-6 text-gray-800">Tablero de Anuncios</h2>

            <!-- Formulario Crear/Editar Anuncio -->
            <div class="bg-white p-6 rounded-lg shadow-md mb-8">
                <h3 id="form-title" class="text-lg font-bold mb-4 text-gray-700">Publicar Nuevo Anuncio</h3>
                <form onsubmit="saveAnuncio(event)">
                    <input type="hidden" id="anuncio-id">
                    <div class="mb-4">
                        <input type="text" id="anuncio-titulo" placeholder="Título del anuncio" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div class="mb-4">
                        <textarea id="anuncio-contenido" placeholder="Escribe tu anuncio aquí..." rows="3" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                    </div>
                    <div class="flex space-x-2">
                        <button type="submit" id="btn-submit-anuncio" class="bg-blue-600 text-white px-4 py-2 rounded-lg font-bold hover:bg-blue-700 transition">Publicar</button>
                        <button type="button" id="btn-cancel-edit" onclick="resetAnuncioForm()" class="bg-gray-400 text-white px-4 py-2 rounded-lg font-bold hidden hover:bg-gray-500 transition">Cancelar</button>
                    </div>
                </form>
            </div>

            <!-- Listado de Anuncios -->
            <div id="anuncios-list" class="space-y-4">
                <!-- Se inyectan dinámicamente con JS -->
            </div>
        </section>

        <!-- SECCIÓN: CALENDARIO -->
        <section id="section-calendario" class="container mx-auto p-6 max-w-5xl flex-grow hidden">
            <div class="bg-white p-6 rounded-lg shadow-md">
                <h2 class="text-2xl font-bold mb-6 text-gray-800">Calendario Académico</h2>
                <div id='calendar'></div>
            </div>
        </section>
    </div>

    <!-- LÓGICA JAVASCRIPT -->
    <script>
        // Inicializar datos en localStorage si no existen
        if (!localStorage.getItem('usuarios')) {
            localStorage.setItem('usuarios', JSON.stringify([]));
        }
        if (!localStorage.getItem('anuncios')) {
            localStorage.setItem('anuncios', JSON.stringify([
                { id: 1, titulo: 'Bienvenida al Portal', contenido: 'Bienvenidos al sistema socio comunicativo del colegio.', autor: 'Administrador', fecha: '2026-09-18' }
            ]));
        }

        let currentUser = JSON.parse(localStorage.getItem('currentUser')) || null;

        document.addEventListener('DOMContentLoaded', () => {
            if (currentUser) {
                showApp();
            }
        });

        // Alternar entre Login y Registro
        function toggleAuth(showRegister) {
            document.getElementById('login-box').classList.toggle('hidden', showRegister);
            document.getElementById('register-box').classList.toggle('hidden', !showRegister);
        }

        // Registrar Usuario
        function handleRegister(e) {
            e.preventDefault();
            const nombre = document.getElementById('reg-name').value;
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-pass').value;

            let usuarios = JSON.parse(localStorage.getItem('usuarios'));
            if (usuarios.some(u => u.email === email)) {
                alert('El correo electrónico ya está registrado.');
                return;
            }

            usuarios.push({ nombre, email, password });
            localStorage.setItem('usuarios', JSON.stringify(usuarios));
            alert('¡Registro exitoso! Ahora puedes iniciar sesión.');
            toggleAuth(false);
        }

        // Iniciar Sesión
        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-pass').value;

            let usuarios = JSON.parse(localStorage.getItem('usuarios'));
            const user = usuarios.find(u => u.email === email && u.password === password);

            if (user || (email === 'admin@ceb.com' && password === 'admin')) {
                currentUser = user ? user : { nombre: 'Administrador', email };
                localStorage.setItem('currentUser', JSON.stringify(currentUser));
                showApp();
            } else {
                alert('Correo o contraseña incorrectos.');
            }
        }

        // Cerrar Sesión
        function logout() {
            localStorage.removeItem('currentUser');
            currentUser = null;
            document.getElementById('app-container').classList.add('hidden');
            document.getElementById('auth-container').classList.remove('hidden');
        }

        // Mostrar Aplicación Principal
        function showApp() {
            document.getElementById('auth-container').classList.add('hidden');
            document.getElementById('app-container').classList.remove('hidden');
            document.getElementById('user-display').innerText = currentUser.nombre;
            renderAnuncios();
            initCalendar();
        }

        // Cambiar pestañas (Tablero / Calendario)
        function switchTab(tab) {
            const isTablero = tab === 'tablero';
            document.getElementById('section-tablero').classList.toggle('hidden', !isTablero);
            document.getElementById('section-calendario').classList.toggle('hidden', isTablero);
            
            document.getElementById('nav-tablero').className = isTablero ? "text-blue-600 font-semibold hover:underline" : "text-gray-600 hover:underline";
            document.getElementById('nav-calendario').className = !isTablero ? "text-blue-600 font-semibold hover:underline" : "text-gray-600 hover:underline";
            
            if (!isTablero && calendar) {
                setTimeout(() => calendar.updateSize(), 100);
            }
        }

        // --- CRUD DE ANUNCIOS ---
        function renderAnuncios() {
            const anuncios = JSON.parse(localStorage.getItem('anuncios'));
            const container = document.getElementById('anuncios-list');
            container.innerHTML = '';

            anuncios.forEach(anuncio => {
                const isOwner = anuncio.autor === currentUser.nombre;
                container.innerHTML += `
                    <div class="bg-white p-6 rounded-lg shadow-md border border-gray-100">
                        <div class="flex justify-between items-center mb-2">
                            <h4 class="text-xl font-bold text-gray-800">${anuncio.titulo}</h4>
                            <span class="text-xs text-gray-500">${anuncio.fecha}</span>
                        </div>
                        <p class="text-gray-700 mb-4 whitespace-pre-line">${anuncio.contenido}</p>
                        <div class="flex justify-between items-center text-sm text-gray-500 border-t pt-3">
                            <span>Publicado por: <strong>${anuncio.autor}</strong></span>
                            ${isOwner ? `
                            <div class="space-x-3">
                                <button onclick="editAnuncio(${anuncio.id})" class="text-yellow-600 hover:underline font-semibold">Editar</button>
                                <button onclick="deleteAnuncio(${anuncio.id})" class="text-red-600 hover:underline font-semibold">Eliminar</button>
                            </div>` : ''}
                        </div>
                    </div>
                `;
            });
        }

        function saveAnuncio(e) {
            e.preventDefault();
            const id = document.getElementById('anuncio-id').value;
            const titulo = document.getElementById('anuncio-titulo').value;
            const contenido = document.getElementById('anuncio-contenido').value;
            let anuncios = JSON.parse(localStorage.getItem('anuncios'));

            if (id) {
                // Editar anuncio existente
                anuncios = anuncios.map(a => a.id == id ? { ...a, titulo, contenido } : a);
            } else {
                // Crear nuevo anuncio
                const nuevo = {
                    id: Date.now(),
                    titulo,
                    contenido,
                    autor: currentUser.nombre,
                    fecha: new Date().toISOString().split('T')[0]
                };
                anuncios.unshift(nuevo);
            }

            localStorage.setItem('anuncios', JSON.stringify(anuncios));
            resetAnuncioForm();
            renderAnuncios();
        }

        function editAnuncio(id) {
            const anuncios = JSON.parse(localStorage.getItem('anuncios'));
            const anuncio = anuncios.find(a => a.id == id);
            if (!anuncio) return;

            document.getElementById('anuncio-id').value = anuncio.id;
            document.getElementById('anuncio-titulo').value = anuncio.titulo;
            document.getElementById('anuncio-contenido').value = anuncio.contenido;
            document.getElementById('form-title').innerText = 'Editar Anuncio';
            document.getElementById('btn-submit-anuncio').innerText = 'Guardar Cambios';
            document.getElementById('btn-cancel-edit').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function deleteAnuncio(id) {
            if (!confirm('¿Estás seguro de eliminar este anuncio?')) return;
            let anuncios = JSON.parse(localStorage.getItem('anuncios'));
            anuncios = anuncios.filter(a => a.id != id);
            localStorage.setItem('anuncios', JSON.stringify(anuncios));
            renderAnuncios();
        }

        function resetAnuncioForm() {
            document.getElementById('anuncio-id').value = '';
            document.getElementById('anuncio-titulo').value = '';
            document.getElementById('anuncio-contenido').value = '';
            document.getElementById('form-title').innerText = 'Publicar Nuevo Anuncio';
            document.getElementById('btn-submit-anuncio').innerText = 'Publicar';
            document.getElementById('btn-cancel-edit').classList.add('hidden');
        }

        // --- CALENDARIO ---
        let calendar;
        function initCalendar() {
            if (calendar) return;
            const calendarEl = document.getElementById('calendar');
            calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                locale: 'es',
                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'dayGridMonth,timeGridWeek,listWeek'
                },
                events: [
                    { title: 'Entrega de Proyecto Web', start: '2026-09-25' },
                    { title: 'Evaluación de Periodo', start: '2026-09-30' }
                ]
            });
            calendar.render();
        }
    </script>
</body>
</html>
