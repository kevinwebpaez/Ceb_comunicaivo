<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>CEB Portal - Minimal Editorial</title>

    <link rel="stylesheet" href="./CSS/styles.css">
    <link rel="stylesheet" href="./CSS/fonts.css">
    
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300,0,0" rel="stylesheet" />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bloom: {
                            bg: '#e8e4d9',      
                            button: '#f6c358',  
                            buttonHover: '#e3b145',
                            text: '#2d2d2d',    
                            light: '#f4f1ea',    
                        },
                        periwinkle: {
                            500: '#5c6bc0',      
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        sport: ['Oswald', 'sans-serif'],
                    },
                },
            },
        }
    </script>

    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <style>
        [x-cloak] { display: none !important; }
        
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d1cdc2; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #b0aba0; }

        body {
            font-family: 'Inter', sans-serif;
            background-image: url("./static/Images/fondo.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: #2d2d2d;
        }
    </style>
</head>

<body class="antialiased min-h-screen flex flex-col relative transition-colors duration-300" x-data="cebPortalApp()" :class="darkMode ? 'text-[#f4f1ea]' : 'text-[#2d2d2d]'">

    <div x-show="page !== 'inicio'"
         x-transition.opacity.duration.1000ms
         class="fixed inset-0 pointer-events-none z-0">
        <div class="absolute inset-0 bg-[#e8e4d9] opacity-40 mix-blend-multiply" :class="darkMode ? 'bg-[#121212]' : 'bg-[#e8e4d9]'"></div>
    </div>

    <!-- HEADER -->
    <header x-transition x-cloak
            class="w-full absolute top-0 left-0 right-0 z-50 bg-transparent transition-all duration-300"
            :class="page === 'inicio' ? 'text-white' : 'text-bloom-text'">
        <div class="max-w-7xl mx-auto px-6 lg:px-12">
            <div class="flex justify-between items-center h-24">
                
                <div class="flex-shrink-0 cursor-pointer" @click="navigate('inicio')">
                    <span class="font-sans font-bold text-xl tracking-[0.2em] uppercase">CEB Portal</span>
                </div>
               
                <nav class="hidden md:flex space-x-8 lg:space-x-12 items-center">
                    <template x-for="navItem in ['inicio', 'anuncios', 'deportes', 'calendario']">
                        <button @click="navigate(navItem)"
                                class="text-[15px] font-black italic tracking-widest uppercase transition-all duration-300 cursor-pointer hover:-translate-y-0.5 relative group"
                                :class="page === navItem ? (page === 'inicio' ? 'text-white' : 'text-bloom-text') : (page === 'inicio' ? 'text-white/70 hover:text-white' : 'text-gray-400 hover:text-bloom-text')">
                            <span x-text="navItem"></span>
                            <span class="absolute -bottom-2 left-0 w-full h-[3px] transition-transform duration-300 origin-left"
                                  :class="page === navItem ? 'bg-bloom-button scale-x-100' : 'bg-bloom-button scale-x-0 group-hover:scale-x-100'"></span>
                        </button>
                    </template>
                </nav>

                <div class="hidden md:flex items-center gap-6">
                    <button @click="navigate('perfil')" class="text-[15px] font-medium transition-opacity hover:opacity-60 cursor-pointer">
                        Mi Perfil
                    </button>
                </div>

                <button class="md:hidden" @click="mobileMenuOpen = !mobileMenuOpen">
                    <span class="material-symbols-outlined text-3xl">menu</span>
                </button>
            </div>
        </div>
    </header>

    <!-- MOBILE MENU -->
    <div x-show="mobileMenuOpen" x-transition.opacity x-cloak class="fixed inset-0 bg-bloom-bg z-50 flex flex-col p-8 md:hidden text-bloom-text">
        <div class="flex justify-end mb-12">
            <button @click="mobileMenuOpen = false"><span class="material-symbols-outlined text-3xl">close</span></button>
        </div>
        <nav class="flex flex-col space-y-6 text-2xl font-sans font-black italic uppercase tracking-widest">
            <template x-for="navItem in ['inicio', 'anuncios', 'deportes', 'calendario', 'perfil']">
                <button @click="navigate(navItem); mobileMenuOpen = false" class="text-left transition-colors"
                        :class="page === navItem ? 'text-bloom-buttonHover' : 'text-bloom-text'">
                    <span x-text="navItem"></span>
                </button>
            </template>
        </nav>
    </div>

    <!-- MAIN CONTENT -->
    <main class="flex-1 w-full relative z-10" :class="page === 'inicio' ? '' : 'max-w-7xl mx-auto px-6 lg:px-12 pt-36 pb-12'">

        <!-- INICIO HERO -->
        <div x-show="page === 'inicio'" x-cloak x-transition.opacity.duration.500ms>
            <div class="relative w-full h-screen min-h-[600px] flex items-center justify-center text-center bg-black/40 backdrop-blur-[1px]">
                <div class="relative z-10 p-6 flex flex-col items-center mt-12">
                    <span class="font-sport text-3xl md:text-5xl text-bloom-button tracking-widest uppercase italic mb-4">
                        Bienvenidos al
                    </span>
                    <h1 class="font-sport text-6xl md:text-8xl font-bold text-white tracking-wider uppercase italic leading-tight mb-10 drop-shadow-md">
                        Portal CEB
                    </h1>
                    <button @click="navigate('anuncios')" class="bg-bloom-button text-bloom-text px-10 py-4 font-sport font-bold italic uppercase tracking-widest hover:bg-bloom-buttonHover hover:scale-105 active:scale-95 transition-all duration-300 shadow-lg cursor-pointer">
                        Explorar Anuncios
                    </button>
                </div>
            </div>
        </div>

        <!-- SECCIÓN CALENDARIO -->
        <div x-show="page === 'calendario'" x-cloak x-transition>
            <h1 class="text-3xl md:text-4xl font-extrabold italic text-center tracking-wide mb-10">
                CALENDARIO
            </h1>

            <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
                <!-- Left Card: Calendar Component -->
                <div class="lg:col-span-8 bg-white/90 backdrop-blur-md rounded-2xl p-6 md:p-8 shadow-sm border border-neutral-100">
                    <div class="flex items-center justify-between mb-8">
                        <h2 class="text-xl md:text-2xl font-bold tracking-tight text-neutral-900" x-text="monthNames[currentMonth] + ' ' + currentYear"></h2>
                        <div class="flex items-center gap-2">
                            <button @click="prevMonth()" class="p-2 rounded-lg hover:bg-neutral-100 text-neutral-600 transition cursor-pointer" aria-label="Mes anterior">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                            </button>
                            <button @click="nextMonth()" class="p-2 rounded-lg hover:bg-neutral-100 text-neutral-600 transition cursor-pointer" aria-label="Mes siguiente">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                            </button>
                        </div>
                    </div>

                    <div class="grid grid-cols-7 text-center text-xs font-semibold text-neutral-400 tracking-wider mb-4">
                        <div>LUN</div><div>MAR</div><div>MIÉ</div><div>JUE</div><div>VIE</div><div>SÁB</div><div>DOM</div>
                    </div>

                    <div class="grid grid-cols-7 gap-y-4 text-center text-sm font-medium text-neutral-700">
                        <template x-for="blank in blankDays">
                            <div></div>
                        </template>
                        <template x-for="day in daysInMonth" :key="day">
                            <div class="py-2 flex flex-col items-center justify-center relative cursor-pointer group transition rounded-lg"
                                 :class="{ 'bg-amber-100/60 font-bold text-amber-600': hasEvent(day), 'hover:bg-neutral-100': !hasEvent(day) }">
                                <span x-text="day"></span>
                                <span x-show="hasEvent(day)" class="absolute bottom-1 w-1 h-1 bg-amber-500 rounded-full"></span>
                            </div>
                        </template>
                    </div>
                </div>

                <!-- Right Card: Upcoming Events Component -->
                <div class="lg:col-span-4 bg-white/90 backdrop-blur-md rounded-2xl p-6 md:p-8 shadow-sm border border-neutral-100">
                    <h3 class="text-xs font-bold tracking-widest uppercase text-neutral-400 mb-6">
                        PRÓXIMOS EVENTOS
                    </h3>
                    <div class="space-y-4">
                        <template x-for="event in filteredEvents" :key="event.id">
                            <div class="bg-neutral-50/80 hover:bg-neutral-100/60 p-4 rounded-xl transition border border-neutral-100/80 flex gap-4 items-start">
                                <span class="text-xl font-extrabold text-amber-500 leading-none pt-0.5" x-text="event.day"></span>
                                <div>
                                    <h4 class="text-xs font-bold text-neutral-900 uppercase" x-text="event.title"></h4>
                                    <p class="text-xs text-neutral-500 mt-1" x-text="event.desc"></p>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <!-- FOOTER -->
    <footer x-cloak x-transition
            class="w-full mt-auto border-t py-8 transition-colors duration-300"
            :class="darkMode ? 'bg-[#1e1e1e] border-white/10 text-gray-400' : 'bg-white border-bloom-text/10 text-bloom-text/70'">
        <div class="max-w-7xl mx-auto px-6 lg:px-12 flex flex-col md:flex-row justify-between items-center gap-4 text-xs">
            <div class="flex items-center gap-2 font-sans">
                <span class="font-bold tracking-wider uppercase" :class="darkMode ? 'text-white' : 'text-bloom-text'">© 2026 CEB Portal.</span>
                <span>Todos los derechos reservados.</span>
            </div>

            <div class="flex gap-6 font-sport tracking-widest uppercase italic font-bold">
                <button @click="navigate('inicio')" class="hover:text-bloom-buttonHover transition-colors cursor-pointer">Inicio</button>
                <button @click="navigate('anuncios')" class="hover:text-bloom-buttonHover transition-colors cursor-pointer">Anuncios</button>
                <button @click="navigate('deportes')" class="hover:text-bloom-buttonHover transition-colors cursor-pointer">Deportes</button>
                <button @click="navigate('calendario')" class="hover:text-bloom-buttonHover transition-colors cursor-pointer">Calendario</button>
            </div>

            <template x-if="userRole">
                <div class="font-sans text-[11px] uppercase tracking-widest bg-bloom-bg/30 px-3 py-1 rounded border border-current opacity-60">
                    Sesión: <span class="font-bold" x-text="userRole"></span>
                </div>
            </template>
        </div>
    </footer>

    <!-- SCRIPT DE ALPINE.JS -->
    <script>
        function cebPortalApp() {
            const todayObj = new Date();

            return {
                page: 'inicio',
                userRole: "Estudiante",
                darkMode: false,
                notifications: true,
                showToast: false,
                searchQuery: '',
                mobileMenuOpen: false,
                selectedSport: null,

                user: {
                    name: "Kevin Paez",
                    email: "kevinwebpaez@gmail.com",
                    tipoDoc: "Cédula de Ciudadanía",
                    numDoc: "1000000000",
                    telefono: "+57 300 000 0000"
                },

                currentMonth: todayObj.getMonth(),
                currentYear: todayObj.getFullYear(),
                realTodayDay: todayObj.getDate(),
                realTodayMonth: todayObj.getMonth(),
                realTodayYear: todayObj.getFullYear(),

                monthNames: ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'],

                get daysInMonth() {
                    const total = new Date(this.currentYear, this.currentMonth + 1, 0).getDate();
                    let arr = [];
                    for(let d = 1; d <= total; d++) { arr.push(d); }
                    return arr;
                },

                get blankDays() {
                    let firstDayIndex = new Date(this.currentYear, this.currentMonth, 1).getDay();
                    let offset = firstDayIndex === 0 ? 6 : firstDayIndex - 1;
                    let blanks = [];
                    for(let b = 0; b < offset; b++) { blanks.push(b); }
                    return blanks;
                },

                eventsData: [
                    { id: 1, year: 2026, monthId: 3, day: 25, title: 'SIRS: Entrega Final', desc: 'Documentación técnica y prototipo de software.' },
                    { id: 2, year: 2026, monthId: 3, day: 28, title: 'Prueba Trimestral', desc: 'Evaluación presencial de bases de datos.' },
                    { id: 3, year: 2026, monthId: 4, day: 15, title: 'Día de la Ciencia', desc: 'Muestra de proyectos tecnológicos y laboratorios.' },
                    { id: 4, year: 2026, monthId: 5, day: 10, title: 'Intercolegiados', desc: 'Apertura del campeonato regional de fútbol.' }
                ],

                prevMonth() {
                    if (this.currentMonth === 0) {
                        this.currentMonth = 11;
                        this.currentYear--;
                    } else {
                        this.currentMonth--;
                    }
                },

                nextMonth() {
                    if (this.currentMonth === 11) {
                        this.currentMonth = 0;
                        this.currentYear++;
                    } else {
                        this.currentMonth++;
                    }
                },

                hasEvent(day) {
                    return this.eventsData.some(e => e.year === this.currentYear && e.monthId === this.currentMonth && e.day === day);
                },

                isToday(day) {
                    return this.realTodayDay === day && this.realTodayMonth === this.currentMonth && this.realTodayYear === this.currentYear;
                },

                get filteredEvents() {
                    return this.eventsData.filter(e => e.year === this.currentYear && e.monthId === this.currentMonth);
                },

                navigate(targetPage) {
                    this.page = targetPage;
                    this.searchQuery = '';
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            }
        }
    </script>
</body>
</html>
