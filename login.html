<!DOCTYPE html>
<html lang="es">
<head>

    <style>
    body {
        /* Si la imagen está en static/images/fondo.jpg */
        background-image: url("{{ url_for('static', filename='images/fondo.jpg') }}");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;
    }
</style>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Iniciar Sesión - CEB Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bloom: { bg: '#e8e4d900', button: '#f6c358', buttonHover: '#e3b145', text: '#2d2d2d' }
                    },
                    fontFamily: { sport: ['Oswald', 'sans-serif'], sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
</head>
<body class="bg-[#f4f1ea] text-[#2d2d2d] flex items-center justify-center min-h-screen p-4">
    <div class="w-full max-w-md bg-white border border-bloom-text/10 rounded-2xl p-8 shadow-xl">
        <div class="text-center mb-8">
            <span class="font-sport font-bold text-sm text-bloom-buttonHover uppercase tracking-widest">CEB Portal</span>
            <h1 class="font-sport text-4xl font-bold uppercase italic mt-1">Iniciar Sesión</h1>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="mb-4 p-3 rounded text-xs font-bold uppercase tracking-wider bg-red-100 text-red-700 border border-red-200">
                {{ message }}
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form action="{{ url_for('login') }}" method="POST" class="space-y-5">
            <div>
                <label class="block font-sport text-xs font-bold uppercase tracking-wider mb-2">Correo Electrónico</label>
                <input type="email" name="email" required placeholder="usuario@institucion.edu"
                       class="w-full px-4 py-3 bg-[#f4f1ea]/50 border border-bloom-text/20 rounded-lg outline-none focus:border-bloom-text text-sm">
            </div>
            <div>
                <label class="block font-sport text-xs font-bold uppercase tracking-wider mb-2">Contraseña</label>
                <input type="password" name="password" required placeholder="••••••••"
                       class="w-full px-4 py-3 bg-[#f4f1ea]/50 border border-bloom-text/20 rounded-lg outline-none focus:border-bloom-text text-sm">
            </div>
            <button type="submit" class="w-full py-3.5 bg-bloom-button text-bloom-text font-sport font-bold italic uppercase tracking-wider text-sm rounded-lg hover:bg-bloom-buttonHover transition-colors shadow">
                Ingresar al Sistema
            </button>
        </form>

        <p class="text-center text-xs mt-6 text-bloom-text/60">
            ¿No tienes una cuenta? 
            <a href="{{ url_for('registro') }}" class="font-bold text-bloom-buttonHover hover:underline uppercase">Regístrate</a>
        </p>
    </div>
</body>
</html>
