
        <!-- PERFIL -->
        <div x-show="page === 'perfil'" x-cloak x-transition.opacity.duration.500ms class="max-w-2xl mx-auto py-8">
            <div class="p-8 md:p-10 shadow-lg border border-bloom-text/10 rounded-xl transition-colors duration-300"
                 :class="darkMode ? 'bg-[#242424] border-white/10' : 'bg-white'">
               
                <div class="text-center">
                    <div class="w-24 h-24 mx-auto bg-bloom-bg text-bloom-text rounded-full flex items-center justify-center mb-4 border border-bloom-text/10 shadow-inner">
                        <span class="font-sport text-4xl font-bold uppercase italic" x-text="user.name.charAt(0)"></span>
                    </div>
                    <h2 class="font-sport text-3xl font-bold uppercase italic mb-1" :class="darkMode ? 'text-white' : 'text-bloom-text'" x-text="user.name"></h2>
                    <p class="text-sm font-normal mb-4" :class="darkMode ? 'text-gray-400' : 'text-bloom-text/70'" x-text="user.email"></p>
                    <template x-if="userRole">
                        <div class="inline-block border border-bloom-buttonHover px-4 py-1.5 mb-8 rounded bg-bloom-button/10">
                            <p class="text-bloom-buttonHover font-sport font-bold uppercase tracking-wider text-xs" x-text="userRole"></p>
                        </div>
                    </template>
                </div>

                <div class="border-t py-6 text-left space-y-4" :class="darkMode ? 'border-white/10' : 'border-bloom-text/10'">
                    <h3 class="font-sport font-bold tracking-wider uppercase text-sm italic" :class="darkMode ? 'text-white' : 'text-bloom-text'">Datos Registrados</h3>
                   
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-xs">
                        <div class="p-3.5 rounded-lg border" :class="darkMode ? 'bg-white/5 border-white/5' : 'bg-bloom-light/40 border-bloom-text/5'">
                            <span class="block font-sport font-bold uppercase tracking-wider text-[11px] mb-1" :class="darkMode ? 'text-bloom-button' : 'text-bloom-buttonHover'">Tipo de Documento</span>
                            <span class="font-medium text-sm" :class="darkMode ? 'text-white' : 'text-bloom-text'" x-text="user.tipoDoc"></span>
                        </div>

                        <div class="p-3.5 rounded-lg border" :class="darkMode ? 'bg-white/5 border-white/5' : 'bg-bloom-light/40 border-bloom-text/5'">
                            <span class="block font-sport font-bold uppercase tracking-wider text-[11px] mb-1" :class="darkMode ? 'text-bloom-button' : 'text-bloom-buttonHover'">Número de Documento</span>
                            <span class="font-medium text-sm" :class="darkMode ? 'text-white' : 'text-bloom-text'" x-text="user.numDoc"></span>
                        </div>

                        <div class="p-3.5 rounded-lg border" :class="darkMode ? 'bg-white/5 border-white/5' : 'bg-bloom-light/40 border-bloom-text/5'">
                            <span class="block font-sport font-bold uppercase tracking-wider text-[11px] mb-1" :class="darkMode ? 'text-bloom-button' : 'text-bloom-buttonHover'">Teléfono / Celular</span>
                            <span class="font-medium text-sm" :class="darkMode ? 'text-white' : 'text-bloom-text'" x-text="user.telefono"></span>
                        </div>

                        <div class="p-3.5 rounded-lg border" :class="darkMode ? 'bg-white/5 border-white/5' : 'bg-bloom-light/40 border-bloom-text/5'">
                            <span class="block font-sport font-bold uppercase tracking-wider text-[11px] mb-1" :class="darkMode ? 'text-bloom-button' : 'text-bloom-buttonHover'">Correo Electrónico</span>
                            <span class="font-medium text-sm truncate block" :class="darkMode ? 'text-white' : 'text-bloom-text'" x-text="user.email"></span>
                        </div>
                    </div>
                </div>

                <div class="border-t border-b py-6 my-4 text-left space-y-5" :class="darkMode ? 'border-white/10' : 'border-bloom-text/10'">
                    <h3 class="font-sport font-bold tracking-wider uppercase text-sm italic" :class="darkMode ? 'text-white' : 'text-bloom-text'">Ajustes de la Cuenta</h3>
                   
                    <div class="flex justify-between items-center">
                        <div class="flex items-center gap-3">
                            <span class="material-symbols-outlined text-xl" :class="darkMode ? 'text-bloom-button' : 'text-bloom-text/60'">dark_mode</span>
                            <span class="text-sm font-medium">Modo Oscuro</span>
                        </div>
                        <button @click="darkMode = !darkMode" class="w-12 h-6 flex items-center rounded-full p-1 transition-colors duration-300 focus:outline-none cursor-pointer" :class="darkMode ? 'bg-bloom-button' : 'bg-gray-300'">
                            <div class="bg-white w-4 h-4 rounded-full shadow-md transform transition-transform duration-300" :class="darkMode ? 'translate-x-6' : 'translate-x-0'"></div>
                        </button>
                    </div>

                    <div class="flex justify-between items-center">
                        <div class="flex items-center gap-3">
                            <span class="material-symbols-outlined text-xl" :class="darkMode ? 'text-bloom-button' : 'text-bloom-text/60'">
                                <span x-text="notifications ? 'notifications' : 'notifications_off'"></span>
                            </span>
                            <span class="text-sm font-medium">Notificaciones del Portal</span>
                        </div>
                        <button @click="notifications = !notifications; if(!notifications) { showToast = true; setTimeout(() => showToast = false, 3000) }" class="w-12 h-6 flex items-center rounded-full p-1 transition-colors duration-300 focus:outline-none cursor-pointer" :class="notifications ? 'bg-periwinkle-500' : 'bg-gray-300'">
                            <div class="bg-white w-4 h-4 rounded-full shadow-md transform transition-transform duration-300" :class="notifications ? 'translate-x-6' : 'translate-x-0'"></div>
                        </button>
                    </div>
                </div>

                <div class="pt-4">
                    <button @click="navigate('inicio')"
                       class="w-full flex items-center justify-center gap-2 py-3.5 bg-red-600 hover:bg-red-700 text-white font-sport font-bold italic uppercase tracking-wider text-xs rounded-lg transition-all duration-300 shadow-md hover:shadow-lg hover:scale-[1.01] active:scale-[0.99] cursor-pointer">
                        <span class="material-symbols-outlined text-base">logout</span>
                        <span>Cerrar Sesión</span>
                    </button>
                </div>

            </div>

            <div x-show="showToast" x-transition x-cloak class="fixed bottom-5 right-5 bg-bloom-text text-white px-4 py-3 rounded-lg shadow-lg flex items-center gap-2 text-xs font-medium z-50">
                <span class="material-symbols-outlined text-sm text-bloom-button">notifications_off</span>
                <span>Notificaciones desactivadas en este dispositivo.</span>
            </div>
        </div>

    </main>
